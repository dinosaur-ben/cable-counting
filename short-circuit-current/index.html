<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電纜短路熱極限評估與保護協調工具</title>
    <!-- 完全不引入任何外部 JS 檔案，真正做到純淨無外部依賴 -->
    <style>
        :root {
            --primary-color: #2b2b2b; --secondary-color: #4a4a4a; --bg-color: #f8f9fa;
            --panel-bg: #ffffff; --border-color: #cccccc; --accent-color: #0056b3;
            --danger-color: #dc3545; --text-color: #333333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; min-height: 100vh; }
        header { background-color: var(--primary-color); color: white; padding: 15px 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        header h1 { font-size: 1.5rem; font-weight: 600; }
        .main-container { display: flex; flex: 1; padding: 20px; gap: 20px; height: calc(100vh - 60px); overflow: hidden; }
        .left-panel { width: 40%; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 15px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        .right-panel { width: 60%; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 15px; display: flex; flex-direction: column; gap: 15px; overflow: hidden; }
        h2 { font-size: 1.1rem; border-bottom: 2px solid var(--primary-color); padding-bottom: 5px; margin-bottom: 10px; color: var(--primary-color); }
        .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        label { font-size: 0.85rem; font-weight: bold; color: var(--secondary-color); }
        input, select { padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 0.9rem; width: 100%; }
        .btn { padding: 8px 15px; border: none; border-radius: 4px; font-size: 0.9rem; cursor: pointer; font-weight: bold; text-align: center; }
        .btn-primary { background-color: var(--accent-color); color: white; }
        .btn-secondary { background-color: #6c757d; color: white; }
        .btn-danger { background-color: var(--danger-color); color: white; }
        .custom-fields { display: none; background: #f0f4f8; padding: 10px; border-radius: 4px; border-left: 4px solid var(--accent-color); margin-top: 5px; }
        .custom-fields.active { display: block; }
        .modal-header-container { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ccc; padding-bottom: 10px; margin-bottom: 15px; }
        .arrow-btn { background: #eee; border: 1px solid #ccc; padding: 6px 14px; border-radius: 4px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        .arrow-btn.disabled { background: #f5f5f5; color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <header>
        <h1>電纜短路熱極限評估工具 (符合 IEC 60364-5-54 規範)</h1>
    </header>
    
    <div class="main-container">
        <div class="left-panel">
            <div>
                <h2>1. 輸入電纜參數</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="unit-select">截面積單位</label>
                        <select id="unit-select" onchange="updateAreaOptions()">
                            <option value="mm2">公制平方 (mm²)</option>
                            <option value="awg">美規線規 (AWG)</option>
                            <option value="mcm">千圓密耳 (MCM)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="area-select">導體截面積</label>
                        <select id="area-select" onchange="toggleCustomArea()"></select>
                    </div>
                </div>
                <div id="custom-area-box" class="custom-fields">
                    <div class="form-group">
                        <label for="custom-area-input">請輸入自訂截面積數值</label>
                        <input type="number" id="custom-area-input" placeholder="例如: 30 或 125">
                    </div>
                </div>
                <div class="form-row" style="margin-top: 10px;">
                    <div class="form-group">
                        <label for="material-select">絕緣材質 / 結構</label>
                        <select id="material-select" onchange="toggleCustomMaterial()">
                            <option value="xlpe">XLPE (交連聚乙烯)</option>
                            <option value="lsfh-xlpe">LSFH - 交連型 (低煙無鹵 90°C)</option>
                            <option value="lsfh-pvc">LSFH - 熱塑型 (低煙無鹵 70°C)</option>
                            <option value="pvc">PVC (聚氯乙烯)</option>
                            <option value="epr">EPR (乙丙烯橡膠)</option>
                            <option value="bare">裸銅線 (接地用)</option>
                            <option value="custom">★ 自訂材料</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="cable-color">圖表顏色</label>
                        <input type="color" id="cable-color" style="height:36px; padding:0; cursor:pointer;">
                    </div>
                </div>
                <div id="custom-material-box" class="custom-fields">
                    <div class="form-group">
                        <label for="custom-name-input">自訂材料名稱</label>
                        <input type="text" id="custom-name-input" placeholder="例如: AAC">
                    </div>
                    <div class="form-row" style="margin-top: 5px;">
                        <div class="form-group">
                            <label for="custom-k-input">自訂材料常數 (k 值)</label>
                            <input type="number" id="custom-k-input" placeholder="例如: 84">
                        </div>
                        <div class="form-group">
                            <label for="custom-temp-input">極限耐溫 (°C)</label>
                            <input type="text" id="custom-temp-input" placeholder="例如: 200">
                        </div>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="addCable()" style="width: 100%; margin-top: 15px;">＋ 新增至管理清單</button>
            </div>
            
            <div style="flex: 1; display: flex; flex-direction: column; min-height: 200px; margin-top: 15px;">
                <h2>2. 電纜管理清單</h2>
                <div style="flex: 1; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 4px;">
                    <table id="cable-table" style="width: 100%; border-collapse: collapse; font-size: 0.85rem; text-align: left;">
                        <thead style="background: #eee; position: sticky; top: 0; z-index: 10;">
                            <tr>
                                <th style="padding: 6px; width: 40px;">顯示</th>
                                <th style="padding: 6px;">規格 / 名稱</th>
                                <th style="padding: 6px; width: 50px;">顏色</th>
                                <th style="padding: 6px; width: 40px; text-align: center;">刪除</th>
                            </tr>
                        </thead>
                        <tbody id="cable-list-body"></tbody>
                    </table>
                </div>
            </div>

            <div style="background: #fdfdfd; border: 1px dashed var(--border-color); padding: 10px; border-radius: 4px;">
                <label style="display: block; margin-bottom: 8px;">📋 Excel 複製欄位自訂勾選：</label>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.8rem; margin-bottom: 10px;">
                    <label style="display: flex; align-items: center; gap: 4px;"><input type="checkbox" id="chk-001"> 0.01 秒電流</label>
                    <label style="display: flex; align-items: center; gap: 4px;"><input type="checkbox" id="chk-01" checked> 0.10 秒電流</label>
                    <label style="display: flex; align-items: center; gap: 4px;"><input type="checkbox" id="chk-03"> 0.30 秒電流</label>
                    <label style="display: flex; align-items: center; gap: 4px;"><input type="checkbox" id="chk-05" checked> 0.50 秒電流</label>
                    <label style="display: flex; align-items: center; gap: 4px;"><input type="checkbox" id="chk-10" checked> 1.00 秒電流</label>
                    <label style="display: flex; align-items: center; gap: 4px;"><input type="checkbox" id="chk-30"> 3.00 秒電流</label>
                </div>
                <div class="form-row">
                    <button class="btn btn-secondary" onclick="copyToExcel()">📋 複製數據到 Excel</button>
                    <button class="btn btn-secondary" onclick="showCalculationReport()">ℹ️ 顯示計算公式</button>
                </div>
            </div>
        </div>
        <div class="right-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; background: #f0f0f0; padding: 10px; border-radius: 4px;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <label for="label-filter-select" style="white-space: nowrap;">📌 圖表特定時間標籤：</label>
                    <select id="label-filter-select" onchange="updateChart()" style="width: auto; padding: 4px 8px;">
                        <option value="none">不顯示特定點標籤</option>
                        <option value="0.01">0.01 秒 (瞬時跳脫)</option>
                        <option value="0.10">0.10 秒 (速斷保護)</option>
                        <option value="0.30">0.30 秒 (協調階梯)</option>
                        <option value="0.50">0.50 秒 (中度故障)</option>
                        <option value="1.00" selected>1.00 秒 (標準基準)</option>
                        <option value="3.00">3.00 秒 (後備延時)</option>
                    </select>
                </div>
                <button class="btn btn-secondary" onclick="downloadChartImage()" style="padding: 4px 10px; font-size: 0.8rem;">📷 下載圖表圖片 (PNG)</button>
            </div>
            <div style="display: flex; gap: 5px; flex-wrap: wrap;">
                <span style="font-size: 0.8rem; font-weight: bold; align-self: center; color: var(--secondary-color);">🔍 座標區間切換：</span>
                <button class="btn btn-secondary" onclick="setChartAxisRange(0.1, 200, 0.01, 10)" style="padding: 3px 8px; font-size: 0.75rem;">1. 全景 (0.1~200kA)</button>
                <button class="btn btn-secondary" onclick="setChartAxisRange(0.1, 20, 0.01, 5)" style="padding: 3px 8px; font-size: 0.75rem;">2. 民用 (0.1~20kA)</button>
                <button class="btn btn-secondary" onclick="setChartAxisRange(1, 100, 0.01, 2)" style="padding: 3px 8px; font-size: 0.75rem;">3. 工業 (1~100kA)</button>
                <button class="btn btn-secondary" onclick="setChartAxisRange(5, 200, 0.01, 0.5)" style="padding: 3px 8px; font-size: 0.75rem;">4. 極速區 (5~200kA)</button>
                <button class="btn btn-secondary" onclick="setChartAxisRange(0.5, 50, 0.1, 10)" style="padding: 3px 8px; font-size: 0.75rem;">5. 高壓延時 (0.5~50kA)</button>
            </div>
            
            <!-- 原生雙對數精密繪圖區外框 -->
            <div id="chart-wrapper" style="flex: 1; min-height: 450px; position: relative; background: #ffffff; border: 1px solid #e0e0e0; border-radius: 4px; padding: 10px; display:flex; justify-content:center; align-items:center;">
                <canvas id="shortCircuitChart" style="width:100%; height:100%; cursor:crosshair;"></canvas>
            </div>
            <div id="custom-legend-container" style="display: flex; flex-wrap: wrap; gap: 12px; font-size: 0.85rem; padding: 5px 10px; background: #fafafa; border-radius: 4px; border: 1px solid #eaeaea; max-height: 60px; overflow-y: auto;"></div>
        </div>
    </div>
    
    <div id="formula-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: #ffffff; width: 80%; max-width: 650px; border-radius: 6px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); position: relative; max-height: 85vh; overflow-y: auto;">
            <span onclick="closeCalculationReport()" style="position: absolute; top: 15px; right: 20px; font-size: 1.5rem; cursor: pointer; font-weight: bold; color: #999;">&times;</span>
            <div class="modal-header-container">
                <button id="btn-prev-cable" class="arrow-btn" onclick="switchFormulaCable(-1)">＜ 前一條</button>
                <h2 id="modal-title" style="border:none; margin:0; padding:0;">IEC 計算書</h2>
                <button id="btn-next-cable" class="arrow-btn" onclick="switchFormulaCable(1)">後一條 ＞</button>
            </div>
            <div id="modal-content" style="font-size: 0.95rem; line-height: 1.6; color: #333;"></div>
            <div style="text-align: right; margin-top: 20px;"><button class="btn btn-primary" onclick="closeCalculationReport()">關閉視窗</button></div>
        </div>
    </div>
    <script>
        let cableData = []; let selectedCableIndex = 0;
        let currentRange = { xMin: 0.1, xMax: 200, yMin: 0.01, yMax: 10 };
        const areaOptions = {
            mm2: [1.5, 2.5, 4, 6, 10, 16, 25, 30, 35, 50, 60, 70, 95, 100, 120, 125, 150, 185, 200, 240, 250, 300, 325, 400, 500, "custom"],
            awg: ["14", "12", "10", "8", "6", "4", "2", "1", "1/0", "2/0", "3/0", "4/0", "custom"],
            mcm: [250, 300, 350, 400, 500, 600, 750, 1000, "custom"]
        };
        const awgToMm2 = { "14": 2.08, "12": 3.31, "10": 5.26, "8": 8.37, "6": 13.3, "4": 21.15, "2": 33.62, "1": 42.41, "1/0": 53.49, "2/0": 67.43, "3/0": 85.01, "4/0": 107.2 };
        const defaultColors = ['#e6194b', '#3cb44b', '#4363d8', '#f58231', '#911eb4', '#008080'];
        let colorIndex = 0;

        function resetColorPicker() {
            const p = document.getElementById('cable-color');
            if (p) p.value = defaultColors[colorIndex % defaultColors.length];
        }
        function updateAreaOptions() {
            const u = document.getElementById('unit-select').value; const s = document.getElementById('area-select'); if (!s) return; s.innerHTML = '';
            areaOptions[u].forEach(opt => {
                const o = document.createElement('option'); o.value = opt;
                o.text = opt === 'custom' ? '★ 自訂輸入' : opt + (u === 'mm2' ? ' mm²' : (u === 'awg' ? ' AWG' : ' MCM'));
                s.appendChild(o);
            });
            toggleCustomArea();
        }
        function toggleCustomArea() {
            const b = document.getElementById('custom-area-box'); const s = document.getElementById('area-select');
            if(b && s) b.style.display = s.value === 'custom' ? 'block' : 'none';
        }
        function toggleCustomMaterial() {
            const b = document.getElementById('custom-material-box'); const s = document.getElementById('material-select');
            if(b && s) b.style.display = s.value === 'custom' ? 'block' : 'none';
        }

        function addCable() {
            const u = document.getElementById('unit-select').value; const s = document.getElementById('area-select').value;
            const m = document.getElementById('material-select').value; const c = document.getElementById('cable-color').value;
            let areaLabel = '', nominalArea = 0, actualAreaMm2 = 0;

            if (s === 'custom') {
                const cv = parseFloat(document.getElementById('custom-area-input').value);
                if (isNaN(cv) || cv <= 0) { alert('請輸入正確的截面積！'); return; }
                nominalArea = cv; actualAreaMm2 = u === 'mm2' ? cv : (u === 'mcm' ? cv * 0.5067 : cv);
                areaLabel = cv + ' ' + u;
            } else {
                nominalArea = s;
                if (u === 'mm2') { actualAreaMm2 = parseFloat(s); areaLabel = s + ' mm²'; }
                else if (u === 'awg') { actualAreaMm2 = awgToMm2[s]; areaLabel = s + ' AWG'; }
                else if (u === 'mcm') { actualAreaMm2 = parseFloat(s) * 0.5067; areaLabel = s + ' MCM'; }
            }

            let matName = '', kValue = 0, tempLabel = '';
            if (m === 'xlpe') { matName = 'XLPE'; kValue = 143; tempLabel = '90°C/250°C'; }
            else if (m === 'lsfh-xlpe') { matName = 'LSFH(交連)'; kValue = 143; tempLabel = '90°C/250°C'; }
            else if (m === 'lsfh-pvc') { matName = 'LSFH(熱塑)'; kValue = 115; tempLabel = '70°C/160°C'; }
            else if (m === 'pvc') { matName = 'PVC'; kValue = 115; tempLabel = '70°C/160°C'; }
            else if (m === 'epr') { matName = 'EPR'; kValue = 130; tempLabel = '90°C/250°C'; }
            else if (m === 'bare') { matName = '裸銅線'; kValue = 176; tempLabel = '30°C/200°C'; }
            else if (m === 'custom') {
                matName = document.getElementById('custom-name-input').value || '自訂材料';
                kValue = parseFloat(document.getElementById('custom-k-input').value) || 100;
                tempLabel = document.getElementById('custom-temp-input').value || 'N/A';
            }

            cableData.push({
                name: `${areaLabel} ${matName}`, nominalArea: nominalArea, unit: u, material: matName,
                k: kValue, temp: tempLabel, areaMm2: actualAreaMm2, color: c, visible: true
            });
            colorIndex++; resetColorPicker();
            selectedCableIndex = cableData.length - 1;
            renderCableList(); resizeCanvasAndDraw();
        }

        function renderCableList() {
            const tbody = document.getElementById('cable-list-body'); const legendContainer = document.getElementById('custom-legend-container');
            if (!tbody || !legendContainer) return; tbody.innerHTML = ''; legendContainer.innerHTML = '';
            cableData.forEach((item, index) => {
                const tr = document.createElement('tr'); tr.style.cursor = 'pointer';
                if(index === selectedCableIndex) tr.style.backgroundColor = '#f1f7ff';
                tr.onclick = (e) => {
                    if (e.target.type !== 'checkbox' && e.target.tagName !== 'BUTTON' && e.target.type !== 'color') {
                        selectedCableIndex = index; renderCableList(); updateChart();
                    }
                };
                
                tr.innerHTML = `<td style='padding:6px;text-align:center;vertical-align:middle;'><input type='checkbox' ${item.visible?'checked':''} onchange='toggleVisibility(${index})'></td>
                                <td style='padding:6px;vertical-align:middle;font-size:0.9rem;font-weight:${index===selectedCableIndex?'bold':'normal'};text-decoration:${index===selectedCableIndex?'underline':'none'}'>${item.name}</td>
                                <td style='padding:6px;text-align:center;vertical-align:middle;'>
                                    <input type='color' value='${item.color}' onchange='updateCableColor(${index},this.value)' style='display:block !important; width:40px !important; height:24px !important; padding:0 !important; margin:0 auto !important; border:1px solid #999 !important; border-radius:4px !important; cursor:pointer !important; background:transparent !important; box-sizing:border-box !important; -webkit-appearance:none !important;'>
                                </td>
                                <td style='padding:6px;text-align:center;vertical-align:middle;'><button class='btn btn-danger' onclick='deleteCable(${index})' style='padding:2px 6px;font-size:0.75rem;'>X</button></td>`;
                tbody.appendChild(tr);
                
                if (item.visible) {
                    const div = document.createElement('div'); div.style.display='flex'; div.style.alignItems='center'; div.style.gap='4px'; div.style.cursor='pointer';
                    div.onclick = () => { selectedCableIndex = index; renderCableList(); updateChart(); showCalculationReport(); };
                    div.innerHTML = `<span style='width:12px;height:12px;background:${item.color};display:inline-block;border-radius:2px;'></span><span style='${index===selectedCableIndex?'font-weight:bold;text-decoration:underline;':''}'>${item.name}</span>`;
                    legendContainer.appendChild(div);
                }
            });
        }

        function toggleVisibility(index) { cableData[index].visible = !cableData[index].visible; renderCableList(); updateChart(); }
        function updateCableColor(index, color) { cableData[index].color = color; renderCableList(); updateChart(); }
        function deleteCable(index) { cableData.splice(index, 1); selectedCableIndex = Math.max(0, cableData.length - 1); renderCableList(); updateChart(); }
        function calculateShortCircuitCurrent(k, areaMm2, t) { return t <= 0 ? 0 : (k * areaMm2) / Math.sqrt(t) / 1000; }

        function setChartAxisRange(xMin, xMax, yMin, yMax) {
            currentRange = { xMin, xMax, yMin, yMax };
            updateChart();
        }
        // 【核心大重盤手術 1】將尺寸縮放獨立開來，保證滑鼠移過去絕不拉伸變形
        function resizeCanvasAndDraw() {
            const canvas = document.getElementById('shortCircuitChart'); if (!canvas) return;
            const rect = canvas.parentElement.getBoundingClientRect();
            
            // 抓取高DPI解析度（Retina抗模糊晶片設定）
            const dpr = window.devicePixelRatio || 1;
            canvas.style.width = (rect.width - 20) + 'px';
            canvas.style.height = (rect.height - 20) + 'px';
            
            // 用實體像素去撐大畫布，再用 CSS 壓縮，畫面就會變得極度細緻銳利
            canvas.width = (rect.width - 20) * dpr;
            canvas.height = (rect.height - 20) * dpr;
            
            updateChart();
        }

        // 【核心大重盤手術 2】純粹負責著色，拒絕在裡面修改任何尺寸設定
        function updateChart(mousePt = null) {
            const canvas = document.getElementById('shortCircuitChart'); if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            const dpr = window.devicePixelRatio || 1;
            const w = canvas.width; const h = canvas.height;
            
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);

            // 依據實體高解析度比例配置留白
            const padding = { top: 25 * dpr, right: 25 * dpr, bottom: 35 * dpr, left: 55 * dpr };
            const plotW = w - padding.left - padding.right;
            const plotH = h - padding.top - padding.bottom;

            function getXPix(val) {
                return padding.left + ((Math.log10(val) - Math.log10(currentRange.xMin)) / (Math.log10(currentRange.xMax) - Math.log10(currentRange.xMin))) * plotW;
            }
            function getYPix(val) {
                return padding.top + (1 - (Math.log10(val) - Math.log10(currentRange.yMin)) / (Math.log10(currentRange.yMax) - Math.log10(currentRange.yMin))) * plotH;
            }

            // 繪製細緻對數格線 (X軸)
            let xStartDec = Math.floor(Math.log10(currentRange.xMin));
            let xEndDec = Math.ceil(Math.log10(currentRange.xMax));
            ctx.lineWidth = 0.5 * dpr;
            for(let d = xStartDec; d <= xEndDec; d++) {
                let base = Math.pow(10, d);
                for(let i = 1; i <= 9; i++) {
                    let v = base * i; if(v < currentRange.xMin || v > currentRange.xMax) continue;
                    let px = getXPix(v);
                    ctx.strokeStyle = (i === 1) ? '#888888' : '#e8e8e8';
                    ctx.beginPath(); ctx.moveTo(px, padding.top); ctx.lineTo(px, h - padding.bottom); ctx.stroke();
                    if(i === 1 || (v < 1 && i === 5) || (v >= 1 && (i===2 || i===5))) {
                        ctx.fillStyle = '#444'; ctx.font = (10 * dpr) + 'px sans-serif'; ctx.textAlign = 'center';
                        ctx.fillText(v >= 1 ? v.toFixed(0) : v.toFixed(1), px, h - padding.bottom + (13 * dpr));
                    }
                }
            }

            // 繪製細緻對數格線 (Y軸)
            let yStartDec = Math.floor(Math.log10(currentRange.yMin));
            let yEndDec = Math.ceil(Math.log10(currentRange.yMax));
            for(let d = yStartDec; d <= yEndDec; d++) {
                let base = Math.pow(10, d);
                for(let i = 1; i <= 9; i++) {
                    let v = base * i; if(v < currentRange.yMin || v > currentRange.yMax) continue;
                    let py = getYPix(v);
                    ctx.strokeStyle = (i === 1) ? '#888888' : '#e8e8e8';
                    ctx.beginPath(); ctx.moveTo(padding.left, py); ctx.lineTo(w - padding.right, py); ctx.stroke();
                    if(i === 1 || i === 5 || v === 0.5) {
                        ctx.fillStyle = '#444'; ctx.font = (10 * dpr) + 'px sans-serif'; ctx.textAlign = 'right';
                        ctx.fillText(v >= 1 ? v.toFixed(0) : (v === 0.5 ? "0.5" : v.toFixed(2)), padding.left - (6 * dpr), py + (4 * dpr));
                    }
                }
            }

            // 緩存所有物理點用來做滑鼠追蹤
            window.renderedPoints = [];
            const filterTime = document.getElementById('label-filter-select').value;

            cableData.forEach((item, index) => {
                if (!item.visible) return;
                ctx.beginPath(); ctx.lineWidth = ((index === selectedCableIndex) ? 3.5 : 1.5) * dpr; ctx.strokeStyle = item.color;
                let first = true; let ptsArray = [];
                
                for (let i = 0; i <= 80; i++) {
                    let ratio = i / 80;
                    let logY = Math.log10(currentRange.yMin) + ratio * (Math.log10(currentRange.yMax) - Math.log10(currentRange.yMin));
                    let t = Math.pow(10, logY); let ka = calculateShortCircuitCurrent(item.k, item.areaMm2, t);
                    let px = getXPix(ka); let py = getYPix(t);
                    
                    ptsArray.push({ xVal: ka, yVal: t, cX: px, cY: py });
                    if(px >= padding.left && px <= w - padding.right) {
                        if (first) { ctx.moveTo(px, py); first = false; } else { ctx.lineTo(px, py); }
                    }
                }
                ctx.stroke();
                window.renderedPoints.push({ cableName: item.name, points: ptsArray, color: item.color });

                if (filterTime !== 'none') {
                    let tT = parseFloat(filterTime); let kaT = calculateShortCircuitCurrent(item.k, item.areaMm2, tT);
                    let cx = getXPix(kaT); let cy = getYPix(tT);
                    if(cx >= padding.left && cx <= w - padding.right && cy >= padding.top && cy <= h - padding.bottom) {
                        ctx.beginPath(); ctx.arc(cx, cy, ((index === selectedCableIndex) ? 6 : 4) * dpr, 0, 2 * Math.PI);
                        ctx.fillStyle = item.color; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5 * dpr; ctx.stroke();
                    }
                }
            });

            if (filterTime !== 'none') {
                let tT = parseFloat(filterTime); let py = getYPix(tT);
                ctx.strokeStyle = 'rgba(220, 53, 69, 0.6)'; ctx.lineWidth = 1.5 * dpr; ctx.beginPath();
                ctx.moveTo(padding.left, py); ctx.lineTo(w - padding.right, py); ctx.stroke();
            }

            ctx.strokeStyle = '#222'; ctx.lineWidth = 1.5 * dpr; ctx.strokeRect(padding.left, padding.top, plotW, plotH);
            ctx.fillStyle = '#222'; ctx.font = 'bold ' + (11 * dpr) + 'px sans-serif'; ctx.textAlign = 'center';
            ctx.fillText("短路電流 I (kA)", padding.left + plotW/2, h - (4 * dpr));

            // 如果有滑鼠指到的點，在最上層疊加畫出交叉線與黑色精細提示框
            if (mousePt) {
                ctx.strokeStyle = '#333'; ctx.lineWidth = 0.6 * dpr;
                ctx.beginPath(); ctx.moveTo(mousePt.cX, padding.top); ctx.lineTo(mousePt.cX, h - padding.bottom); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(padding.left, mousePt.cY); ctx.lineTo(w - padding.right, mousePt.cY); ctx.stroke();
                
                ctx.beginPath(); ctx.arc(mousePt.cX, mousePt.cY, 6 * dpr, 0, 2*Math.PI);
                ctx.fillStyle = mousePt.color; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2 * dpr; ctx.stroke();

                let boxW = 150 * dpr; let boxH = 52 * dpr;
                let boxX = mousePt.cX + (12 * dpr); let boxY = mousePt.cY - (25 * dpr);
                if (boxX + boxW > w) boxX = mousePt.cX - boxW - (12 * dpr);
                
                ctx.fillStyle = 'rgba(30, 30, 30, 0.9)'; ctx.fillRect(boxX, boxY, boxW, boxH);
                ctx.strokeStyle = mousePt.color; ctx.lineWidth = 1 * dpr; ctx.strokeRect(boxX, boxY, boxW, boxH);
                
                ctx.fillStyle = '#fff'; ctx.font = 'bold ' + (10 * dpr) + 'px sans-serif'; ctx.textAlign = 'left';
                ctx.fillText(mousePt.name, boxX + (8 * dpr), boxY + (15 * dpr));
                ctx.font = (10 * dpr) + 'px monospace';
                ctx.fillText(`電流 I: ${mousePt.xVal.toFixed(3)} kA`, boxX + (8 * dpr), boxY + (30 * dpr));
                ctx.fillText(`時間 t: ${mousePt.yVal.toFixed(2)} 秒`, boxX + (8 * dpr), boxY + (44 * dpr));
            }
        }
        // 【核心大重盤手術 3】滑鼠滑過去時，僅發送座標點命令重繪提示框，網頁絕不拉伸
        function handleMouseMove(e) {
            const canvas = document.getElementById('shortCircuitChart'); if (!canvas || !window.renderedPoints) return;
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            
            // 抓出滑鼠在 Canvas 內部對應的高解析度實體像素點
            const mX = (e.clientX - rect.left) * dpr;
            const mY = (e.clientY - rect.top) * dpr;
            
            let closestPt = null; let minDist = 25 * dpr;
            
            window.renderedPoints.forEach(curve => {
                curve.points.forEach(pt => {
                    let dist = Math.sqrt((pt.cX - mX)**2 + (pt.cY - mY)**2);
                    if (dist < minDist) { minDist = dist; closestPt = { xVal: pt.xVal, yVal: pt.yVal, cX: pt.cX, cY: pt.cY, name: curve.cableName, color: curve.color }; }
                });
            });

            // 將捕獲到的點發送給繪圖板，如果沒指到任何點，就單純還原乾淨圖表
            updateChart(closestPt);
        }

        function copyToExcel() {
            if (cableData.length === 0) { alert('清單內目前無電纜資料！'); return; }
            const timeMapping = [
                { value: 0.01, id: "chk-001", label: "0.01秒電流(kA)" }, { value: 0.10, id: "chk-01", label: "0.10秒電流(kA)" },
                { value: 0.30, id: "chk-03",  label: "0.30秒電流(kA)" }, { value: 0.50, id: "chk-05", label: "0.50秒電流(kA)" },
                { value: 1.00, id: "chk-10",  label: "1.00秒電流(kA)" }, { value: 3.00, id: "chk-30", label: "3.00秒電流(kA)" }
            ];
            const actualTimes = []; const actualHeaders = [];
            timeMapping.forEach(item => {
                const el = document.getElementById(item.id); if (el && el.checked) { actualTimes.push(item.value); actualHeaders.push(item.label); }
            });
            let header = ['電纜規格名稱', '導體截面積', '單位', '絕緣材質', '材料常數(K值)', '耐溫等級', ...actualHeaders];
            let txt = header.join('\t') + '\n';
            cableData.forEach(item => {
                let row = [item.name, item.nominalArea, item.unit, item.material, item.k, item.temp];
                actualTimes.forEach(t => { row.push(calculateShortCircuitCurrent(item.k, item.areaMm2, t).toFixed(3)); });
                txt += row.join('\t') + '\n';
            });
            const textArea = document.createElement("textarea"); textArea.value = txt;
            document.body.appendChild(textArea); textArea.select();
            document.execCommand('copy'); document.body.removeChild(textArea);
            alert('📋 【純數據複製成功】請直接至 Excel 貼上 (Ctrl+V)。');
        }

        function showCalculationReport() {
            if (cableData.length === 0) return; const item = cableData[selectedCableIndex];
            document.getElementById('modal-content').innerHTML = `
                <p>依據 <strong>IEC 60364-5-54</strong> 絕熱公式：</p>
                <div style='background:#f4f4f4;padding:12px;text-align:center;font-weight:bold;margin:12px 0;font-size:1.1rem;font-family:monospace;'>I = (k &times; S) / &radic;t</div>
                <p><strong>當前線路：</strong>${item.name}</p>
                <p><strong>特性常數：</strong>k = <strong>${item.k}</strong>，S = <strong>${item.areaMm2.toFixed(2)} mm²</strong></p>
                <div style="background:#eef6fc; padding:10px; border-left:4px solid var(--accent-color); margin:12px 0;">
                    <strong>以故障時間 t = 1.00 秒帶入算式結果：</strong><br>
                    容許短路熱極限電流 = <span style="font-weight:bold;color:var(--danger-color);">${(item.k * item.areaMm2 / 1000).toFixed(3)} kA</span>
                </div>
            `;
            document.getElementById('formula-modal').style.display = 'flex';
        }

        function switchFormulaCable(direction) {
            const newIndex = selectedCableIndex + direction;
            if (newIndex >= 0 && newIndex < cableData.length) {
                selectedCableIndex = newIndex; renderCableList(); showCalculationReport();
            }
        }
        function closeCalculationReport() { document.getElementById('formula-modal').style.display = 'none'; }

        function downloadChartImage() {
            const cvs = document.getElementById('shortCircuitChart'); if (!cvs) return;
            const a = document.createElement('a'); a.download = '原生短路電流評估報告.png'; a.href = cvs.toDataURL('image/png'); a.click();
        }

        function addDefaultExample() {
            cableData = [
                { name: "70 mm² XLPE", nominalArea: 70, unit: "mm2", material: "XLPE", k: 143, temp: "90°C", areaMm2: 70, color: "#e6194b", visible: true },
                { name: "60 mm² XLPE", nominalArea: 60, unit: "mm2", material: "XLPE", k: 143, temp: "90°C", areaMm2: 60, color: "#3cb44b", visible: true },
                { name: "95 mm² XLPE", nominalArea: 95, unit: "mm2", material: "XLPE", k: 143, temp: "90°C", areaMm2: 95, color: "#4363d8", visible: true }
            ];
            colorIndex = 3; renderCableList(); resizeCanvasAndDraw();
        }

        document.getElementById('shortCircuitChart').addEventListener('mousemove', handleMouseMove);
        // 滑鼠離開畫布時，清除靶心十字線與提示框
        document.getElementById('shortCircuitChart').addEventListener('mouseleave', () => { updateChart(); });
        window.addEventListener('resize', resizeCanvasAndDraw);
        setTimeout(() => { updateAreaOptions(); resetColorPicker(); addDefaultExample(); }, 100);
    </script>
</body>
